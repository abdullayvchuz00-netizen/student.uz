<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentUZ — Kirish</title>
</head>

<body>
  <h1>StudentUZ</h1>

  <h2>Ro'yxatdan o'tish</h2>

  <form id="registerForm">
    <input id="name" type="text" placeholder="Ismingiz" required>
    <br><br>

    <input id="username" type="text" placeholder="Username" required>
    <br><br>

    <input id="password" type="password" placeholder="Parol" required>
    <br><br>

    <button type="submit">Register</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            username,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = "✅ Ro'yxatdan o'tish muvaffaqiyatli!";
          form.reset();
        } else {
          message.textContent = "❌ " + data.message;
        }
      } catch (error) {
        message.textContent = "❌ Server bilan bog'lanishda xato.";
      }
    });
  </script>
</body>
</html>
